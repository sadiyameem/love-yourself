<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Love Yourself</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <canvas id="heartCanvas"></canvas>
        <canvas id="confetti-canvas"></canvas>
        <div class="card">
            <div class="heart" id="heart">❤️</div>
            <h1>Love Yourself</h1>
            <p>Loving yourself is important because it is the ultimate foundation of a happy life. And most importantly, the only life-long relationship you will ever have is with yourself. Click the button and the background to see a surprise. 🎉</p>
            <button class="start-btn" onclick="startLove()">Start 💛</button>

        <div id="container">
            <button id="btn">Press to Love</button>
            <div id="output">Press to Love Yourself</div>
        </div>
        </div>
        <audio id="heartSound" src="heartbeat.mp3"></audio>
        <script src="https://cdn.jsdelivr.net/npm/confetti-js@0.0.18/dist/index.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
